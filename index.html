<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My CV</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #444; text-align: center; font-family: sans-serif;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
               max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    body > a { display: inline-block; color: #fff; padding: 8px 12px; margin-bottom: 12px; }
    #pages { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .page { position: relative; width: 100%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .page canvas { display: block; width: 100%; height: 100%; }
    .page a { position: absolute; display: block; }
    .page a:hover { background: rgba(0,100,255,.12); }
    @media (max-width: 600px) {
      body { padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right))
                      max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left)); }
      body > a { margin-bottom: 4px; }
      #pages { gap: 6px; }
    }
  </style>
</head>
<body>
  <a href="cv.pdf" download>Download PDF</a>
  <div id="pages"></div>
  <script type="module">
    import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const container = document.getElementById('pages');
    const pdf = await pdfjs.getDocument('cv.pdf').promise;
    const pages = [];

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const wrap = document.createElement('div');
      wrap.className = 'page';
      wrap.style.aspectRatio = `${base.width} / ${base.height}`;
      const canvas = document.createElement('canvas');
      wrap.appendChild(canvas);
      container.appendChild(wrap);

      // Canvas rendering drops PDF links, so overlay clickable areas (in % so they scale with the page)
      for (const a of await page.getAnnotations()) {
        if (a.subtype !== 'Link' || !a.url) continue;
        const [x1, y1, x2, y2] = base.convertToViewportRectangle(a.rect);
        const link = document.createElement('a');
        link.href = a.url;
        if (/^https?:/.test(a.url)) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
        link.title = a.url;
        Object.assign(link.style, {
          left: Math.min(x1, x2) / base.width * 100 + '%',
          top: Math.min(y1, y2) / base.height * 100 + '%',
          width: Math.abs(x2 - x1) / base.width * 100 + '%',
          height: Math.abs(y2 - y1) / base.height * 100 + '%',
        });
        wrap.appendChild(link);
      }
      pages.push({ page, base, wrap, canvas, task: null });
    }

    // Render at the size the page is actually shown (incl. pinch-zoom) times pixel density, so it stays sharp
    function render() {
      const zoom = window.visualViewport?.scale || 1;
      for (const p of pages) {
        const scale = Math.min(p.wrap.clientWidth / p.base.width * (window.devicePixelRatio || 1) * zoom, 6);
        const viewport = p.page.getViewport({ scale });
        if (p.canvas.width === Math.floor(viewport.width)) continue;
        p.task?.cancel();
        p.canvas.width = Math.floor(viewport.width);
        p.canvas.height = Math.floor(viewport.height);
        p.task = p.page.render({ canvasContext: p.canvas.getContext('2d'), viewport });
        p.task.promise.catch(() => {});
      }
    }

    let timer;
    const schedule = () => { clearTimeout(timer); timer = setTimeout(render, 150); };
    new ResizeObserver(schedule).observe(container);
    window.visualViewport?.addEventListener('resize', schedule);
    render();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

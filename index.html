<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My CV</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body { margin: 0; background: #444; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; }
    canvas { max-width: 100%; height: auto; box-shadow: 0 2px 8px rgba(0,0,0,.4); background: #fff; }
    a { color: #fff; font-family: sans-serif; }
    .page { position: relative; max-width: 100%; }
    .page canvas { display: block; width: 100%; }
    .page a { position: absolute; display: block; }
    .page a:hover { background: rgba(0,100,255,.12); }
  </style>
</head>
<body>
  <a href="cv.pdf" download>Download PDF</a>
  <div id="pages"></div>
  <script type="module">
    import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const pdf = await pdfjs.getDocument('cv.pdf').promise;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 2 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const wrap = document.createElement('div');
      wrap.className = 'page';
      wrap.style.width = viewport.width / 2 + 'px';
      wrap.appendChild(canvas);
      document.getElementById('pages').appendChild(wrap);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

      // Canvas rendering drops PDF links, so overlay clickable areas (in % so they scale with the page)
      for (const a of await page.getAnnotations()) {
        if (a.subtype !== 'Link' || !a.url) continue;
        const [x1, y1, x2, y2] = viewport.convertToViewportRectangle(a.rect);
        const link = document.createElement('a');
        link.href = a.url;
        if (/^https?:/.test(a.url)) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
        link.title = a.url;
        Object.assign(link.style, {
          left: Math.min(x1, x2) / viewport.width * 100 + '%',
          top: Math.min(y1, y2) / viewport.height * 100 + '%',
          width: Math.abs(x2 - x1) / viewport.width * 100 + '%',
          height: Math.abs(y2 - y1) / viewport.height * 100 + '%',
        });
        wrap.appendChild(link);
      }
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
